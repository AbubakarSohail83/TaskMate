{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
        <title>{% block title %}TaskMate{% endblock %}</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta http-equiv="X-UA-Compatible" content="ie=edge">
		{% tailwind_css %}
	</head>

	<body class="bg-black text-white font-serif leading-normal tracking-normal">
		<nav class="bg-teal-600 text-white p-4 text-xl flex justify-between">
			<div>
				<a href="{% url 'home'%}">TaskMate</a>
			</div>
			<div>
				{}
			</div>
		</nav>
		<header>
			<h1>TaskMate</h1>
			{% if request.user.is_authenticated %}
				<p>Welcome, {{ request.user.username }}</p>
				<form method="POST" action="{% url 'logout' %}" style="display:inline;">
					{% csrf_token %}
					<button type="submit" style="background:none; border:none; color:blue; text-decoration:underline; cursor:pointer;">
					  Logout
					</button>
				  </form>
			{% else %}
				<a href="{% url 'login' %}">Login</a> | <a href="{% url 'signup' %}">Sign Up</a>
			{% endif %}
		</header>
		<main class="container mx-auto">
			{% block content %}{% endblock %}
		</main>

        <footer>
            <p>&copy; 2025 Taskmate</p>
        </footer>
	</body>
</html>
